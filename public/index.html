<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medallero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --surface:#121B2E;
    --surface-2:#1A2740;
    --line:#28324A;
    --text:#ECEAE3;
    --text-dim:#8C97AE;
    --gold:#D9B44A;
    --gold-dim:#7A6428;
    --silver:#B7BEC7;
    --silver-dim:#5A6068;
    --bronze:#B5713C;
    --bronze-dim:#5E3A20;
    --track:#C1440E;
    --track-dim:#7A2C09;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #1a2744 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{
    display:flex;justify-content:space-between;align-items:flex-start;
    flex-wrap:wrap;gap:16px;margin-bottom:36px;
  }
  .titleblock h1{
    font-family:'Oswald',sans-serif;font-weight:700;
    font-size:clamp(32px,5vw,48px);letter-spacing:1px;
    margin:0;color:var(--text);text-transform:uppercase;
  }
  .titleblock .sub{
    color:var(--text-dim);font-size:13px;letter-spacing:2px;
    text-transform:uppercase;margin-top:4px;display:flex;align-items:center;gap:8px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--track);
    box-shadow:0 0 0 0 rgba(193,68,14,.6);animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(193,68,14,.55);}
    70%{box-shadow:0 0 0 8px rgba(193,68,14,0);}
    100%{box-shadow:0 0 0 0 rgba(193,68,14,0);}
  }

  .admin-toggle{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);
    padding:8px 14px;border-radius:8px;
  }
  .admin-toggle span{font-size:13px;color:var(--text-dim);letter-spacing:.5px;}
  .switch{
    position:relative;width:42px;height:24px;border-radius:20px;
    background:var(--surface-2);border:1px solid var(--line);
    cursor:pointer;flex-shrink:0;transition:background .2s;
  }
  .switch.on{background:var(--track-dim);border-color:var(--track);}
  .switch .knob{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--text-dim);transition:transform .2s, background .2s;
  }
  .switch.on .knob{transform:translateX(18px);background:var(--track);}

  .podium-section{margin-bottom:44px;}
  .podium{
    display:flex;align-items:flex-end;justify-content:center;gap:14px;
    padding:20px 10px 0;
  }
  .pod-col{width:150px;display:flex;flex-direction:column;align-items:center;}
  .pod-name{
    font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;
    text-transform:uppercase;text-align:center;margin-bottom:8px;
    letter-spacing:.5px;color:var(--text);min-height:20px;
  }
  .pod-bar{
    width:100%;border-radius:10px 10px 4px 4px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:14px;transition:height .5s cubic-bezier(.2,.9,.3,1);
    position:relative;overflow:hidden;
  }
  .pod-bar::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 40%);
  }
  .pod-rank{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;color:rgba(0,0,0,.55);
  }
  .pod-medals{
    font-family:'Space Mono',monospace;font-size:12px;color:rgba(0,0,0,.6);
    margin-top:6px;letter-spacing:.5px;
  }
  .pod-1 .pod-bar{background:linear-gradient(180deg,var(--gold),var(--gold-dim));height:180px;}
  .pod-2 .pod-bar{background:linear-gradient(180deg,var(--silver),var(--silver-dim));height:130px;}
  .pod-3 .pod-bar{background:linear-gradient(180deg,var(--bronze),var(--bronze-dim));height:95px;}
  .pod-2{order:1;} .pod-1{order:2;} .pod-3{order:3;}

  .board{
    background:var(--surface);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;
  }
  .board-head{
    display:grid;grid-template-columns:44px 1fr 64px 64px 64px 72px;
    padding:12px 18px;font-size:11px;letter-spacing:1.5px;color:var(--text-dim);
    text-transform:uppercase;border-bottom:1px solid var(--line);
  }
  .board-head.admin{grid-template-columns:44px 1fr 96px 96px 96px 72px;}
  .row{
    display:grid;grid-template-columns:44px 1fr 64px 64px 64px 72px;
    align-items:center;padding:12px 18px;
    border-bottom:1px solid var(--line);
  }
  .row.admin{grid-template-columns:44px 1fr 96px 96px 96px 72px;}
  .row:last-child{border-bottom:none;}
  .rank{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;color:var(--text-dim);
  }
  .row:nth-child(1) .rank, .row:nth-child(2) .rank{color:var(--text);}
  .name-field{
    font-family:'Inter',sans-serif;font-weight:600;font-size:15px;color:var(--text);
    background:transparent;border:none;border-bottom:1px solid transparent;
    padding:2px 0;width:100%;
  }
  .name-field:focus{outline:none;border-bottom:1px solid var(--track);}
  .name-field:disabled{cursor:default;}
  .medal-cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .medal-count{
    font-family:'Space Mono',monospace;font-weight:700;font-size:17px;
  }
  .g{color:var(--gold);} .s{color:var(--silver);} .b{color:var(--bronze);}
  .medal-btns{display:flex;gap:4px;}
  .medal-btns button{
    width:20px;height:20px;border-radius:4px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text-dim);font-size:12px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s, color .15s;
  }
  .medal-btns button:hover{background:var(--track-dim);color:var(--text);border-color:var(--track);}
  .total{
    font-family:'Space Mono',monospace;font-weight:700;font-size:17px;color:var(--text);
    text-align:right;
  }

  .footer-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:18px;flex-wrap:wrap;gap:10px;
  }
  .updated{font-size:12px;color:var(--text-dim);}
  .reset-btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    background:transparent;color:var(--track);border:1px solid var(--track-dim);
    padding:8px 14px;border-radius:8px;cursor:pointer;letter-spacing:.3px;
  }
  .reset-btn:hover{background:var(--track-dim);color:var(--text);}

  .overlay{
    position:fixed;inset:0;background:rgba(6,10,20,.72);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .overlay.hidden{display:none;}
  .modal{
    background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:26px;width:100%;max-width:320px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .modal h2{
    font-family:'Oswald',sans-serif;font-size:20px;text-transform:uppercase;
    letter-spacing:.5px;margin:0 0 4px;color:var(--text);
  }
  .modal p{font-size:13px;color:var(--text-dim);margin:0 0 16px;}
  .modal input{
    width:100%;padding:10px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--text);
    font-family:'Space Mono',monospace;font-size:14px;margin-bottom:8px;
  }
  .modal input:focus{outline:none;border-color:var(--track);}
  .modal .err{color:var(--track);font-size:12px;min-height:16px;margin-bottom:8px;}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;}
  .modal-btns button{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
  }
  .btn-cancel{background:transparent;color:var(--text-dim);}
  .btn-cancel:hover{color:var(--text);}
  .btn-enter{background:var(--track-dim);color:var(--text);border-color:var(--track);}
  .btn-enter:hover{background:var(--track);}

  @media (max-width:560px){
    .pod-col{width:100px;}
    .board-head, .row{grid-template-columns:30px 1fr 46px 46px 46px 54px;padding:10px 8px;}
    .board-head.admin, .row.admin{grid-template-columns:30px 1fr 62px 62px 62px 54px;}
    .medal-btns button{width:17px;height:17px;font-size:10px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="titleblock">
      <h1>Medallero IMB-PC</h1>
      <div class="sub"><span class="dot"></span> En vivo · 8 Sedes</div>
    </div>
    <div class="admin-toggle">
      <span id="adminLabel">Modo administrador</span>
      <div class="switch" id="switchEl" onclick="toggleAdmin()"><div class="knob"></div></div>
    </div>
  </header>

  <div class="podium-section">
    <div class="podium" id="podium"></div>
  </div>

  <div class="board">
    <div class="board-head" id="boardHead">
      <span>#</span><span>Concursante</span><span style="text-align:center">Oro</span>
      <span style="text-align:center">Plata</span><span style="text-align:center">Bronce</span>
      <span style="text-align:right">Total</span>
    </div>
    <div id="rows"></div>
  </div>

  <div class="footer-bar">
    <span class="updated" id="updated">Cargando…</span>
    <button class="reset-btn" id="resetBtn" style="display:none" onclick="resetAll()">Reiniciar medallero</button>
  </div>

</div>

<div class="overlay hidden" id="pwOverlay">
  <div class="modal">
    <h2>Acceso administrador</h2>
    <p>Ingresa la contraseña para editar el medallero.</p>
    <input type="password" id="pwInput" placeholder="Contraseña" autocomplete="off" />
    <div class="err" id="pwErr"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closePasswordModal()">Cancelar</button>
      <button class="btn-enter" onclick="submitPassword()">Entrar</button>
    </div>
  </div>
</div>

<script>
// Si algún día sirves esta página desde un dominio distinto al del
// servidor (server.js), pon aquí la URL completa del backend, por
// ejemplo: const API_BASE = 'https://tu-backend.onrender.com';
const API_BASE = '';

let adminMode = false;
let adminPassword = null;
let contestants = [];
let lastSnapshot = null;

async function fetchContestants(){
  try{
    const res = await fetch(API_BASE + '/api/contestants');
    if(!res.ok) throw new Error('respuesta no válida');
    const data = await res.json();
    const asString = JSON.stringify(data);
    if(asString !== lastSnapshot){
      contestants = data;
      lastSnapshot = asString;
      render();
    }
    document.getElementById('updated').textContent =
      'Actualizado: ' + new Date().toLocaleTimeString('es-GT');
  }catch(e){
    document.getElementById('updated').textContent = 'Sin conexión con el servidor…';
  }
}

function toggleAdmin(){
  if(adminMode){
    adminMode = false;
    adminPassword = null;
    sessionStorage.removeItem('adminPw');
    applyAdminUI();
  } else {
    openPasswordModal();
  }
}

function openPasswordModal(){
  document.getElementById('pwErr').textContent = '';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('pwInput').focus(), 50);
}
function closePasswordModal(){
  document.getElementById('pwOverlay').classList.add('hidden');
}

async function submitPassword(){
  const val = document.getElementById('pwInput').value;
  try{
    const res = await fetch(API_BASE + '/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: val })
    });
    const data = await res.json();
    if(data.ok){
      adminMode = true;
      adminPassword = val;
      sessionStorage.setItem('adminPw', val);
      closePasswordModal();
      applyAdminUI();
    } else {
      document.getElementById('pwErr').textContent = 'Contraseña incorrecta.';
    }
  }catch(e){
    document.getElementById('pwErr').textContent = 'No se pudo conectar con el servidor.';
  }
}

function applyAdminUI(){
  document.getElementById('switchEl').classList.toggle('on', adminMode);
  document.getElementById('resetBtn').style.display = adminMode ? 'inline-block' : 'none';
  render();
}

async function changeMedal(id, field, delta){
  const c = contestants.find(x => x.id === id);
  if(!c) return;
  c[field] = Math.max(0, c[field] + delta); // actualización optimista
  render();
  try{
    await fetch(API_BASE + '/api/contestants/' + id + '/medal', {
      method:'PATCH',
      headers:{'Content-Type':'application/json','x-admin-password':adminPassword},
      body: JSON.stringify({ field, delta })
    });
  }catch(e){ /* el siguiente sondeo corrige el estado si algo falló */ }
  fetchContestants();
}

async function renameContestant(id, name){
  try{
    await fetch(API_BASE + '/api/contestants/' + id + '/name', {
      method:'PUT',
      headers:{'Content-Type':'application/json','x-admin-password':adminPassword},
      body: JSON.stringify({ name })
    });
  }catch(e){ /* silencioso */ }
  fetchContestants();
}

async function resetAll(){
  if(!confirm('¿Reiniciar todas las medallas a cero? Esta acción no se puede deshacer.')) return;
  try{
    await fetch(API_BASE + '/api/reset', {
      method:'POST',
      headers:{'x-admin-password':adminPassword}
    });
  }catch(e){ /* silencioso */ }
  fetchContestants();
}

function render(){
  const list = contestants; // el servidor ya lo entrega ordenado por posición
  const top3 = list.slice(0,3);
  const podiumEl = document.getElementById('podium');
  const order = [1,0,2];
  podiumEl.innerHTML = order.map(i => {
    const c = top3[i];
    if(!c) return '';
    const rankNum = i+1;
    return `
      <div class="pod-col pod-${rankNum}">
        <div class="pod-name">${escapeHtml(c.name)}</div>
        <div class="pod-bar">
          <div class="pod-rank">${rankNum}</div>
          <div class="pod-medals">O${c.gold} P${c.silver} B${c.bronze}</div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('boardHead').className = 'board-head' + (adminMode ? ' admin' : '');

  document.getElementById('rows').innerHTML = list.map((c, i) => `
      <div class="row ${adminMode ? 'admin' : ''}">
        <div class="rank">${i+1}</div>
        <div>
          <input class="name-field" value="${escapeAttr(c.name)}"
            ${adminMode ? '' : 'disabled'}
            onchange="renameContestant(${c.id}, this.value)" />
        </div>
        ${medalCell(c, 'gold', 'g')}
        ${medalCell(c, 'silver', 's')}
        ${medalCell(c, 'bronze', 'b')}
        <div class="total">${c.gold + c.silver + c.bronze}</div>
      </div>`).join('');
}

function medalCell(c, field, cls){
  const btns = adminMode ? `
    <div class="medal-btns">
      <button onclick="changeMedal(${c.id}, '${field}', -1)">−</button>
      <button onclick="changeMedal(${c.id}, '${field}', 1)">+</button>
    </div>` : '';
  return `<div class="medal-cell"><span class="medal-count ${cls}">${c[field]}</span>${btns}</div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById('pwInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') submitPassword();
  if(e.key === 'Escape') closePasswordModal();
});

// Si ya habías iniciado sesión como administrador en este navegador, se restaura
const savedPw = sessionStorage.getItem('adminPw');
if(savedPw){
  adminPassword = savedPw;
  adminMode = true;
}

applyAdminUI();
fetchContestants();
// "Tiempo real" por sondeo: cada 3 segundos se pregunta al servidor
// si algo cambió. Es simple y funciona en cualquier hosting; si más
// adelante quieres actualizaciones instantáneas sin este pequeño
// retraso, se puede agregar WebSockets (socket.io).
setInterval(fetchContestants, 3000);
</script>
</body>
</html>
